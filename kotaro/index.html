/* リンククリックの計測。デザインとフェードには干渉しない。 */
(function(){
  function send(el){
    var name = el.getAttribute('data-ev');
    if(!name || typeof gtag !== 'function') return;
    gtag('event', name, {
      article_id: el.getAttribute('data-article') || '',
      link_position: el.getAttribute('data-position') || '',
      link_url: el.getAttribute('href') || '',
      link_text: (el.getAttribute('data-label') || '').slice(0, 90)
    });
  }
  var links = document.querySelectorAll('a[data-ev]');
  for(var i=0;i<links.length;i++){
    (function(el){
      el.addEventListener('click', function(){ send(el); });
      el.addEventListener('auxclick', function(e){ if(e.button===1) send(el); });
    })(links[i]);
  }
})();
</script>
